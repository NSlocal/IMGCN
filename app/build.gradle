plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'
        minSdk 23
        targetSdk 36
        versionCode 10000
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        // Enable multidex (safe for debugging; minSdk >= 21 has native support)
        multiDexEnabled true
    }

    // --- NEW: signing config (reads secrets or project properties) ---
    signingConfigs {
        release {
            // prefer explicit env var KEYSTORE_PATH, otherwise look for ./keystore.jks in workspace
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: rootProject.file("keystore.jks")
            storeFile file(keystorePath)
            storePassword project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            keyAlias project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
            keyPassword project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // TEMPORARY: disable minification and shrinking to make crash debugging easier.
            // Re-enable after we determine the cause and add any required -keep rules.
            minifyEnabled false
            shrinkResources false
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            // use the release signingConfig
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

// Add multidex dependency to help avoid class-not-found issues on startup (safe for debugging)
dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
