plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'

        minSdk 26
        targetSdk 36

        versionCode 10001
        versionName '1.0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            jniDebuggable false
            zipAlignEnabled true

            /*
             * IMPORTANT:
             * No keystore fallback is used here.
             *
             * The GitHub Actions workflow may attach signing through
             * an environment-provided keystore.
             *
             * Do NOT put:
             *
             * ?: rootProject.file("keystore.jks")
             *
             * into this file.
             */

            def keyPath = System.getenv("KEYSTORE_PATH")

            if (keyPath != null &&
                !keyPath.trim().isEmpty() &&
                file(keyPath).isFile()) {

                signingConfig = signingConfigs.maybeCreate("release")

                signingConfig.storeFile = file(keyPath)

                signingConfig.storePassword =
                    System.getenv("KEYSTORE_PASSWORD")

                signingConfig.keyAlias =
                    System.getenv("KEY_ALIAS")

                signingConfig.keyPassword =
                    System.getenv("KEY_PASSWORD")
            }

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                ),
                'proguard-rules.pro'
            )
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}
