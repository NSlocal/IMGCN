plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'
        minSdk 23
        targetSdk 36
        versionCode 10000
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        // Enable multidex (safe for debugging; minSdk >= 21 has native support)
        multiDexEnabled true
    }

    // --- NEW: signing config (reads secrets or project properties) ---
    signingConfigs {
    release {
        def keystorePath = System.getenv("KEYSTORE_PATH")

        if (keystorePath != null && !keystorePath.isEmpty()) {
            storeFile file(keystorePath)
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
}

buildTypes {
    release {
        minifyEnabled false
        shrinkResources false
        debuggable false
        jniDebuggable false
        zipAlignEnabled true

        if (System.getenv("KEYSTORE_PATH") != null) {
            signingConfig signingConfigs.release
        }

        proguardFiles(
            getDefaultProguardFile("proguard-android-optimize.txt"),
            "proguard-rules.pro"
        )
    }

    debug {
        minifyEnabled false
        shrinkResources false
    }
}
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

// Add multidex dependency to help avoid class-not-found issues on startup (safe for debugging)
dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
