plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'

        minSdk 23
        targetSdk 36

        versionCode 10000
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        multiDexEnabled true
    }

    /*
     * Release signing is OPTIONAL.
     *
     * When GitHub Actions restores a private keystore,
     * KEYSTORE_PATH points to the file and the APK is signed.
     *
     * When no keystore is configured, no signingConfig is attached.
     * Gradle can therefore create an unsigned Release APK for testing.
     *
     * IMPORTANT:
     * There is intentionally NO fallback to rootProject.file("keystore.jks").
     * That fallback caused the current validateSigningRelease failure.
     */

    def releaseKeystorePath =
        System.getenv("KEYSTORE_PATH")

    def releaseKeystoreFile = null

    if (releaseKeystorePath != null &&
        !releaseKeystorePath.trim().isEmpty()) {

        def candidate =
            file(releaseKeystorePath)

        if (candidate.isFile()) {
            releaseKeystoreFile = candidate
        }
    }

    if (releaseKeystoreFile != null) {

        signingConfigs {
            release {
                storeFile releaseKeystoreFile

                storePassword System.getenv(
                    "KEYSTORE_PASSWORD"
                )

                keyAlias System.getenv(
                    "KEY_ALIAS"
                )

                keyPassword System.getenv(
                    "KEY_PASSWORD"
                )
            }
        }
    }

    buildTypes {

        release {
            minifyEnabled false
            shrinkResources false

            debuggable false
            jniDebuggable false

            zipAlignEnabled true

            /*
             * Only sign when a real keystore was restored.
             */
            if (releaseKeystoreFile != null) {
                signingConfig signingConfigs.release
            }

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                ),
                'proguard-rules.pro'
            )
        }

        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
