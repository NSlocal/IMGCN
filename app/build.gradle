plugins { id 'com.android.application' }

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'
        minSdk 23
        targetSdk 36
        versionCode 10000
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
