plugins { id 'com.android.application' }

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'
        minSdk 23
        targetSdk 36
        versionCode 10000
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    // --- NEW: signing config (reads secrets or project properties) ---
    signingConfigs {
        release {
            // prefer explicit env var KEYSTORE_PATH, otherwise look for ./keystore.jks in workspace
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: rootProject.file("keystore.jks")
            storeFile file(keystorePath)
            storePassword project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            keyAlias project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
            keyPassword project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            // use the release signingConfig
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
