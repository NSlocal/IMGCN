plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.performance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.universal.performance'
        minSdk 23
        targetSdk 36

        versionCode 10001
        versionName '1.0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")

            if (keystorePath != null &&
                !keystorePath.isEmpty()) {

                storeFile file(keystorePath)

                storePassword System.getenv(
                    "KEYSTORE_PASSWORD"
                )

                keyAlias System.getenv(
                    "KEY_ALIAS"
                )

                keyPassword System.getenv(
                    "KEY_PASSWORD"
                )
            }
        }
    }

    buildTypes {

        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            jniDebuggable false
            zipAlignEnabled true

            /*
             * Do not force a missing keystore.
             *
             * If GitHub Actions provides KEYSTORE_PATH,
             * Gradle signs the Release APK.
             *
             * If it is absent, assembleRelease can still
             * create an unsigned Release APK for testing.
             */
            if (System.getenv("KEYSTORE_PATH") != null &&
                !System.getenv("KEYSTORE_PATH").isEmpty()) {

                signingConfig signingConfigs.release
            }

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                ),
                'proguard-rules.pro'
            )
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}
