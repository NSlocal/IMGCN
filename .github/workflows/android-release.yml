name: Android ARM64 Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Clean
        run: |
          ./gradlew clean --no-daemon

      - name: Restore optional signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$GITHUB_WORKSPACE/keystore.jks"

            test -s "$GITHUB_WORKSPACE/keystore.jks"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" \
              >> "$GITHUB_ENV"

            echo "Signed release mode."

          else

            echo "No complete signing configuration."
            echo "Unsigned release test mode."

          fi

      - name: Build ARM64 Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-performance-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Remove temporary keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/keystore.jks"
