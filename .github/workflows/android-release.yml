name: Universal Performance ARM64 Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Repair missing Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing; using system Gradle to generate it."
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper is ready."

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ls -la gradle/wrapper/
          ./gradlew --version

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build ARM64 Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          test -d "$APK_DIR"
          ls -lah "$APK_DIR"
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          for apk in "$APK_DIR"/*.apk; do
            file "$apk"
          done

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-performance-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
