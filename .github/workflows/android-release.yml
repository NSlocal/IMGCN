name: Universal Performance Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found. Generating..."
            gradle wrapper
          else
            echo "Gradle wrapper found."
          fi

      - name: Gradle wrapper
        run: ./gradlew --version

      # Restore keystore from secret and ensure it's accessible
      - name: Restore keystore
        id: restore_keystore
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "⚠️  WARNING: KEYSTORE_BASE64 secret is not configured"
            echo "Building unsigned debug APK instead."
            echo ""
          else
            echo "✓ Decoding KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

            if [ ! -f keystore.jks ]; then
              echo "❌ ERROR: Failed to create keystore.jks"
              echo "The Base64 decoding may have failed. Please verify the KEYSTORE_BASE64 secret is correct."
              exit 1
            fi

            echo "✓ Keystore restored successfully"
            ls -lh keystore.jks

            # Export path for Gradle signing properties
            echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV
            echo "keystore_present=true" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build APK(s)
        run: |
          set -e
          if [ -f keystore.jks ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" --no-daemon
          else
            echo "Building unsigned debug APK..."
            ./gradlew :app:assembleDebug --no-daemon
          fi
        shell: bash

      - name: Verify APK(s)
        run: |
          echo "Listing debug APKs (if any):"
          ls -lh app/build/outputs/apk/debug/ || true
          echo "Listing release APKs (if any):"
          ls -lh app/build/outputs/apk/release/ || true
          echo "All APK files found:"
          find app/build/outputs/apk -type f -name "*.apk" -print || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-performance-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/**/*.apk
          
