name: Universal Performance ARM64 Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Repair missing Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper JAR missing."
            echo "Generating Gradle 8.10.2 wrapper."

            gradle wrapper \
              --gradle-version 8.10.2 \
              --distribution-type bin
          fi

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Clean
        run: |
          ./gradlew clean --no-daemon

      # ------------------------------------------------------
      # OPTIONAL SIGNING
      # ------------------------------------------------------

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            echo "signing=true" >> "$GITHUB_OUTPUT"

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$GITHUB_WORKSPACE/keystore.jks"

            test -s "$GITHUB_WORKSPACE/keystore.jks"

            echo "Permanent release signing key restored."

          else

            echo "signing=false" >> "$GITHUB_OUTPUT"

            echo "WARNING:"
            echo "Release signing secrets are not configured."
            echo "Building an UNSIGNED test Release APK."
            echo ""
            echo "For a public update APK, configure:"
            echo "KEYSTORE_BASE64"
            echo "KEYSTORE_PASSWORD"
            echo "KEY_ALIAS"
            echo "KEY_PASSWORD"

          fi

      # ------------------------------------------------------
      # BUILD
      # ------------------------------------------------------

      - name: Build ARM64 Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_SIGNING_ENABLED: ${{ steps.signing.outputs.signing }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_SIGNING_ENABLED" = "true" ]; then
            echo "Building SIGNED ARM64 Release APK."
          else
            echo "Building UNSIGNED ARM64 Release APK for testing."
          fi

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------
      # VERIFY APK
      # ------------------------------------------------------

      - name: Verify ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          test -d "$APK_DIR"

          echo "Release output:"
          ls -lah "$APK_DIR"

          APK_COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK count: $APK_COUNT"

          for apk in "$APK_DIR"/*.apk; do
            echo "----------------------------------------"
            echo "$apk"
            ls -lh "$apk"
            file "$apk"
          done

      # ------------------------------------------------------
      # ARTIFACT
      # ------------------------------------------------------

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-performance-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------
      # GITHUB RELEASE
      # ------------------------------------------------------

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      # ------------------------------------------------------
      # CLEAN PRIVATE KEY
      # ------------------------------------------------------

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/keystore.jks"
