name: Android ARM64 Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          command -v gradle
          gradle --version

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || \
          test -f settings.gradle.kts

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          echo "Android project files found."

      - name: Restore optional signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ] &&
             [ -n "${KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${KEY_ALIAS:-}" ] &&
             [ -n "${KEY_PASSWORD:-}" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$GITHUB_WORKSPACE/keystore.jks"

            test -s "$GITHUB_WORKSPACE/keystore.jks"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" \
              >> "$GITHUB_ENV"

            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"

            echo "Complete signing configuration found."

          else

            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"

            echo "No complete signing configuration."
            echo "Release will be unsigned."

          fi

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build ARM64 Release
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          test -d "$APK_DIR"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK"

          echo "APK found:"
          echo "$APK"

          if command -v zipinfo >/dev/null 2>&1; then
            echo "Checking APK archive..."
            zipinfo -t "$APK"
          fi

      - name: Check APK ABI
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if command -v unzip >/dev/null 2>&1; then

            echo "Native ARM64 libraries:"
            unzip -l "$APK" | \
              grep "lib/arm64-v8a/" || \
              echo "No native ARM64 libraries in this APK."

          fi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: IMGCN-ARM64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/keystore.jks"
          
