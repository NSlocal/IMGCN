name: Universal Performance Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # make secrets available as env (values come from repository Secrets)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Restore keystore from secret and ensure it's accessible
      - name: Restore keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  WARNING: KEYSTORE_BASE64 secret is not configured"
            echo "Proceeding without signing. The APK will be unsigned."
            echo ""
            echo "To enable signing, configure these repository secrets:"
            echo "1. Navigate to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Create the following repository secrets:"
            echo "   - KEYSTORE_BASE64: Base64-encoded keystore file content"
            echo "   - KEYSTORE_PASSWORD: Your keystore password"
            echo "   - KEY_ALIAS: Your signing key alias"
            echo "   - KEY_PASSWORD: Your signing key password"
            echo ""
            echo "To generate a keystore, run:"
            echo "  keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000"
            echo "  base64 keystore.jks | tr -d '\n'"
            echo ""
          else
            echo "✓ Decoding KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            
            if [ ! -f keystore.jks ]; then
              echo "❌ ERROR: Failed to create keystore.jks"
              echo "The Base64 decoding may have failed. Please verify the KEYSTORE_BASE64 secret is correct."
              exit 1
            fi
            
            echo "✓ Keystore restored successfully"
            ls -lh keystore.jks
            
            # Set KEYSTORE_PATH for Gradle to use
            echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build ARM64 Release APK
        # Gradle will read signing info from env vars (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          file app/build/outputs/apk/release/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-performance-arm64
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          
