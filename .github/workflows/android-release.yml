name: Universal Performance Android ARM64 Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Repair Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper JAR missing."
            echo "Generating Gradle 8.10.2 wrapper."

            gradle wrapper \
              --gradle-version 8.10.2 \
              --distribution-type bin
          fi

          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Clean
        run: |
          ./gradlew clean --no-daemon

      # ------------------------------------------------------
      # OPTIONAL RELEASE SIGNING
      # ------------------------------------------------------

      - name: Restore release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] ||
             [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] ||
             [ -z "$KEY_PASSWORD" ]; then

            echo "No complete signing configuration found."
            echo "Release APK will be UNSIGNED for testing."

            echo "signing=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/keystore.jks"

          test -s "$GITHUB_WORKSPACE/keystore.jks"

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" \
            >> "$GITHUB_ENV"

          echo "signing=true" >> "$GITHUB_OUTPUT"

          echo "Release keystore restored successfully."

      # ------------------------------------------------------
      # BUILD
      # ------------------------------------------------------

      - name: Build ARM64 Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_PATH:-}" ] &&
             [ -f "${KEYSTORE_PATH}" ]; then

            echo "Building SIGNED ARM64 Release APK."

          else

            echo "Building UNSIGNED ARM64 Release APK."
            echo "This is acceptable for build testing only."

          fi

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------
      # VERIFY
      # ------------------------------------------------------

      - name: Verify ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          test -d "$APK_DIR"

          echo "Release APK directory:"
          ls -lah "$APK_DIR"

          APK_COUNT=$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: No Release APK produced."
            exit 1
          fi

          echo "APK count: $APK_COUNT"

          for apk in "$APK_DIR"/*.apk; do
            echo "----------------------------------------"
            echo "APK: $apk"
            ls -lh "$apk"
            file "$apk"
          done

      # ------------------------------------------------------
      # UPLOAD ARTIFACT
      # ------------------------------------------------------

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-performance-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------
      # PUBLISH GITHUB RELEASE
      # ------------------------------------------------------

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      # ------------------------------------------------------
      # DELETE PRIVATE KEY
      # ------------------------------------------------------

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/keystore.jks"
